; RER A departure board for the ESP32 2.8" ST7789 "Cheap Yellow Display" (USB-C variant)
;
; All PlatformIO packages (toolchain, framework, libraries) are kept inside this
; folder (.pio-core) so nothing is installed system-wide.

[platformio]
core_dir = .pio-core
default_envs = cyd_st7789

[env:cyd_st7789]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv

lib_deps =
    lvgl/lvgl@9.2.2
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.2.1

build_flags =
    -Os
    -I include
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D CORE_DEBUG_LEVEL=0
    ; ---- TFT_eSPI setup (CYD2USB / ST7789 variant) ----
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR        ; swap to TFT_RGB if red/blue are inverted
    -D TFT_INVERSION_OFF=1          ; use TFT_INVERSION_ON if colours look like a negative
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
